databases:
  - name: sql-practice-db
    plan: free
    databaseName: sql_practice
    user: sql_practice_user

services:
  - type: web
    name: sql-practice-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --prefer-binary -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_API_BASE
        value: https://api.groq.com/openai/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: DATABASE_URL
        fromDatabase:
          name: sql-practice-db
          property: connectionString
      - key: ADMIN_TOKEN
        sync: false

  - type: web
    name: sql-practice-frontend
    runtime: static
    buildCommand: ""
    staticPublishPath: frontend

  # No automated cadence job for now -- Render cron jobs have no free tier
  # (see cron_check_cadence.py, kept around for whenever this gets
  # revisited). Trigger a new problem batch by hand instead:
  #   curl -X POST $BACKEND_URL/api/admin/problems/generate-batch \
  #     -H "X-Admin-Token: $ADMIN_TOKEN" -d '{"count": 5}'
