databases:
  - name: sql-practice-db
    plan: free
    databaseName: sql_practice
    user: sql_practice_user

services:
  - type: web
    name: sql-practice-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --prefer-binary -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_API_BASE
        value: https://api.groq.com/openai/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: DATABASE_URL
        fromDatabase:
          name: sql-practice-db
          property: connectionString
      - key: ADMIN_TOKEN
        sync: false

  - type: web
    name: sql-practice-frontend
    runtime: static
    buildCommand: ""
    staticPublishPath: frontend

  # Runs weekly (cron can't express "every 45 days" directly); the script
  # itself checks content_cadence.last_batch_generated_at and only
  # actually triggers a new problem batch once >=45 days have elapsed.
  - type: cron
    name: sql-practice-content-cadence
    runtime: python
    plan: free
    rootDir: backend
    schedule: "0 3 * * 1"
    buildCommand: pip install --prefer-binary -r requirements.txt
    startCommand: python cron_check_cadence.py
    envVars:
      - key: BACKEND_URL
        value: https://sql-practice-backend-6bpi.onrender.com
      - key: ADMIN_TOKEN
        sync: false
