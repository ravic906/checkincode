services:
  - type: web
    name: sql-practice-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --prefer-binary -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_API_BASE
        value: https://api.groq.com/openai/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-20b

  - type: web
    name: sql-practice-frontend
    runtime: static
    buildCommand: ""
    staticPublishPath: frontend
