<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PhoenixPrep — Admin: Dashboard</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-brand"><span class="brand-wordmark-inner"><span class="accent">Phoenix</span>Prep</span> <span class="admin-tag">Admin</span></div>
      <nav class="admin-sidebar-nav">
        <a href="admin-dashboard.html" data-page="dashboard"><span class="icon">◆</span> Dashboard</a>
        <a href="admin.html" data-page="problems"><span class="icon">▤</span> Problems</a>
        <a href="admin-users.html" data-page="users"><span class="icon">◑</span> Users</a>
        <a href="admin-admins.html" data-page="admins"><span class="icon">◈</span> Admins</a>
        <a href="index.html" class="admin-nav-back"><span class="icon">←</span> Back to PhoenixPrep.in</a>
      </nav>
      <div class="admin-sidebar-footer">
        <div id="authSection"></div>
        <button class="fallback-toggle" id="tokenFallbackToggle">Use token instead</button>
        <div class="admin-token-fallback" id="adminTokenFallbackPanel">
          <input type="password" id="adminTokenFallback" placeholder="Admin token" />
        </div>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-page-header">
        <div>
          <h1>Dashboard</h1>
          <p class="subtitle">Overview of users and content across PhoenixPrep.</p>
        </div>
      </div>

      <div id="errorArea"></div>
      <div class="stat-grid" id="statGrid"></div>
      <p id="lastBatchNote" class="subtitle" style="margin: -8px 0 20px;"></p>

      <div class="card">
        <div class="section-title">Quick links</div>
        <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:6px;">
          <a class="btn" href="admin.html">Review pending drafts →</a>
          <a class="btn" href="admin-users.html">Browse users →</a>
          <a class="btn" href="admin-admins.html">Manage admins →</a>
        </div>
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="admin-shared.js"></script>
  <script src="admin-dashboard.js"></script>
</body>
</html>
