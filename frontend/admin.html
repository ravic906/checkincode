<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PhoenixPrep — Admin: Problems</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-brand"><span class="accent">Phoenix</span>Prep <span class="admin-tag">Admin</span></div>
      <nav class="admin-sidebar-nav">
        <a href="admin-dashboard.html" data-page="dashboard"><span class="icon">◆</span> Dashboard</a>
        <a href="admin.html" data-page="problems"><span class="icon">▤</span> Problems</a>
        <a href="admin-users.html" data-page="users"><span class="icon">◑</span> Users</a>
        <a href="admin-admins.html" data-page="admins"><span class="icon">◈</span> Admins</a>
        <a href="index.html" class="admin-nav-back"><span class="icon">←</span> Back to PhoenixPrep.in</a>
      </nav>
      <div class="admin-sidebar-footer">
        <div id="authSection"></div>
        <button class="fallback-toggle" id="tokenFallbackToggle">Use token instead</button>
        <div class="admin-token-fallback" id="adminTokenFallbackPanel">
          <input type="password" id="adminTokenFallback" placeholder="Admin token" />
        </div>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-page-header">
        <div>
          <h1>Problems</h1>
          <p class="subtitle">Review pending drafts and manage what's live.</p>
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="generateBtn">Generate New Batch</button>
        </div>
      </div>

      <div id="errorArea"></div>

      <div class="tabs">
        <button id="tabPending" class="active">Pending Drafts</button>
        <button id="tabLive">Live Problems</button>
      </div>

      <div id="pendingSection">
        <p class="subtitle" id="cadenceNote" style="margin-bottom:16px;"></p>
        <div id="pendingList"></div>
      </div>

      <div id="liveSection" style="display:none;">
        <div class="category-pills" id="liveCategoryCounts"></div>
        <div class="filter-row">
          <input type="text" id="liveSearch" placeholder="Search title or topic…" />
          <select id="liveTrackFilter">
            <option value="">All tracks</option>
            <option value="sql">SQL</option>
            <option value="python">Python</option>
            <option value="case">Business Case</option>
          </select>
        </div>
        <div id="liveList"></div>
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="admin-shared.js"></script>
  <script src="admin.js"></script>
</body>
</html>
